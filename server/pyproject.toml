[project]
name = "microspeed-turn-server"
version = "0.1.0"
description = "Mint ephemeral Cloudflare Realtime TURN credentials for Microspeed."
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
